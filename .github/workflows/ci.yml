# Typecheck, test and build on every push and pull request, on Linux, Windows and macOS.
# No secrets, no signing, no publishing: official installers are built and signed by the maintainers'
# release pipeline (README "Packaging and releases"). Third-party actions are pinned to commits.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # pnpm version comes from package.json "packageManager".
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      # Linux compiles node-pty from source here (build-essential and python3 are preinstalled on the runner).
      - run: pnpm install --frozen-lockfile

      - name: Build (typecheck + electron-vite)
        run: pnpm build

      - run: pnpm test

      - name: Package an unpacked app (Linux)
        if: runner.os == 'Linux'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: pnpm exec electron-builder --linux dir --publish never
